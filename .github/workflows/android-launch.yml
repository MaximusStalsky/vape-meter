name: Android release launch

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release or draft with the APK to test
        required: true
        type: string
      previous_tag:
        description: Previous release to install before testing the upgrade
        required: false
        type: string

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out launch test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-android-arm64.apk' --output "$RUNNER_TEMP/candidate.apk" -- "$RELEASE_TAG"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-android-arm64.apk' --output "$RUNNER_TEMP/previous.apk" -- "$PREVIOUS_TAG"
          fi

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-android-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-launch.sh
      - name: Remove test APKs
        if: always()
        run: rm -f "$RUNNER_TEMP/candidate.apk" "$RUNNER_TEMP/previous.apk"
